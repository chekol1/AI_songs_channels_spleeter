# Web tier (FE) - React served by nginx, exposed to the internet via ELB
# Replace 010686621615 before applying (or use the sed command in DEPLOY_GUIDE.md)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sonicloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: 010686621615.dkr.ecr.us-east-1.amazonaws.com/sonicloud-web:latest
          env:
            # nginx now resolves its upstream per-request, and its resolver does
            # NOT apply the search domains in /etc/resolv.conf -- so this must be
            # a fully-qualified name or requests fail with:
            #   api-service could not be resolved (3: Host not found)
            - name: API_UPSTREAM
              value: http://api-service.sonicloud.svc.cluster.local:5000
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: sonicloud
spec:
  type: LoadBalancer   # <-- public entry point to the app
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
