# In-cluster image builds with Kaniko (no Docker daemon needed).
# Prereq: terraform apply (creates the IRSA role in infra/irsa.tf).
#
# Usage:
#   kubectl apply -f k8s/build-jobs.yaml
#   kubectl logs job/build-worker -n sonicloud -f
#   (re-run a build: kubectl delete job build-worker -n sonicloud && kubectl apply -f k8s/build-jobs.yaml)
#
# Note: first-ever deploy still needs one local ./build_and_push.sh -
# the cluster must exist before it can build images (bootstrap).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-builder
  namespace: sonicloud
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::010686621615:role/sonicloud-image-builder
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-api
  namespace: sonicloud
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: image-builder
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=git://github.com/chekol1/AI_songs_channels_spleeter.git#refs/heads/main
            - --context-sub-path=api
            - --dockerfile=Dockerfile
            - --destination=010686621615.dkr.ecr.us-east-1.amazonaws.com/sonicloud-api:latest
          env:
            - name: AWS_REGION
              value: us-east-1
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-web
  namespace: sonicloud
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: image-builder
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=git://github.com/chekol1/AI_songs_channels_spleeter.git#refs/heads/main
            - --context-sub-path=web
            - --dockerfile=Dockerfile
            - --destination=010686621615.dkr.ecr.us-east-1.amazonaws.com/sonicloud-web:latest
          env:
            - name: AWS_REGION
              value: us-east-1
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-worker
  namespace: sonicloud
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: image-builder
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=git://github.com/chekol1/AI_songs_channels_spleeter.git#refs/heads/main
            - --context-sub-path=app
            - --dockerfile=Dockerfile
            - --destination=010686621615.dkr.ecr.us-east-1.amazonaws.com/sonicloud-worker:latest
          env:
            - name: AWS_REGION
              value: us-east-1
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }   # heavy build (TensorFlow layers)
