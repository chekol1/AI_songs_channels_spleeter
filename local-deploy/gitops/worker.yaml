# Background processor: polls SQS, runs spleeter, uploads stems. No Service.
# As Argo CD deploys it; see api.yaml for how this folder works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sonicloud
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: 000000000000.dkr.ecr.us-east-1.localhost:5100/sonicloud-worker:local-v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: sonicloud-env, key: AWS_REGION } }
            - name: AWS_ENDPOINT_URL
              valueFrom: { configMapKeyRef: { name: sonicloud-env, key: AWS_ENDPOINT_URL } }
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: QUEUE_URL
              valueFrom: { configMapKeyRef: { name: sonicloud-env, key: QUEUE_URL } }
            - name: RESULT_BUCKET
              valueFrom: { configMapKeyRef: { name: sonicloud-env, key: RESULTS_BUCKET } }
            # spleeter reads: environ.get("MODEL_PATH", "pretrained_models")
            # Pointing it at the PVC is what stops the per-pod re-download.
            - name: MODEL_PATH
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits:   { cpu: "2",  memory: 6Gi }   # TensorFlow was OOMKilled at 3Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: spleeter-models
