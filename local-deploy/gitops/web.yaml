# Web tier, as Argo CD deploys it. See api.yaml for how this folder works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sonicloud
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: 000000000000.dkr.ecr.us-east-1.localhost:5100/sonicloud-web:local-v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            # FQDN required: nginx's resolver ignores resolv.conf search domains.
            - name: API_UPSTREAM
              value: http://api-service.sonicloud.svc.cluster.local:5000
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: sonicloud
spec:
  type: LoadBalancer
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
