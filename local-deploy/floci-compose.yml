# Floci: the local AWS emulator this deployment targets.
# Self-contained -- does not depend on any other stack on the machine.
services:
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:latest}
    container_name: sonicloud-floci
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    environment:
      # Deliberately NO FLOCI_STORAGE_MODE: the image ships no default for it
      # and refuses to boot on an unknown value.
      DEBUG: "0"
    volumes:
      # Floci backs EKS/RDS/ECR with REAL containers, so it needs the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    restart: unless-stopped
    networks: [sonicloud-net]

  # Lets the build machine on the home network push images.
  # Floci publishes its registry on 127.0.0.1 only, so nothing outside this
  # host can reach it. This forwards <LAN address>:5101 to it. deploy.sh sets
  # REGISTRY_LAN_BIND to this host's LAN address; it is never a public address.
  registry-lan:
    image: alpine/socat
    container_name: sonicloud-registry-lan
    network_mode: host
    command:
      - "TCP-LISTEN:${REGISTRY_LAN_PORT:-5101},bind=${REGISTRY_LAN_BIND:-127.0.0.1},fork,reuseaddr"
      - "TCP:127.0.0.1:${REGISTRY_PORT:-5100}"
    restart: unless-stopped

volumes:
  floci-data:

networks:
  sonicloud-net:
    name: sonicloud-net
    driver: bridge
