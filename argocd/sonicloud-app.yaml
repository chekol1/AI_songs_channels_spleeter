# ArgoCD Application: "watch the k8s/ folder on the eks-showcase branch
# and keep the cluster in sync with it."
# Apply once after terraform: kubectl apply -f argocd/sonicloud-app.yaml
#
# NOTE: lives in its own folder (not k8s/) so ArgoCD doesn't manage
# its own definition recursively.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonicloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chekol1/AI_songs_channels_spleeter.git
    targetRevision: eks-showcase
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sonicloud
  syncPolicy:
    automated:
      prune: true      # a resource removed from Git is removed from the cluster
      selfHeal: true   # a manual change in the cluster is reverted to what Git says.
                       # Safe now: the release pipeline no longer touches the cluster,
                       # it only commits a new image tag here.
    syncOptions:
      - CreateNamespace=true
